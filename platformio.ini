; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Set a path to a cache folder
; build_cache_dir = D:\platformio\cache 
; Examples:
; (Unix) build_cache_dir = /path/to/cache/folder build_flags = 
; (Windows) build_cache_dir = C:/path/to/cache/folder build_type = debug


[env:esp32solo1]
platform = espressif32 @ 6.12.0
framework = arduino
board =  adafruit_qtpy_esp32s3_n4r2
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CONFIG_SPI_MOSI=35
    -D CONFIG_SPI_SCK=36
    -D CONFIG_SPI_CS=37
    -D CONFIG_PIN_DC=38
    -D CONFIG_PIN_RST=39
    -D CONFIG_PIN_BUSY=40
    -D CONFIG_SPI_MISO=-1
    -D CORE_DEBUG_LEVEL=5
	-D CONFIG_ARDUHAL_LOG_COLORS=1 
	-D CONFIG_DAC_32bit=1 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.partitions = mypartitions.csv
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 80000000L
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
extra_scripts = ./extra_script.py