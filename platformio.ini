; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Set a path to a cache folder
; Examples:
; (Unix) build_cache_dir = /path/to/cache/folder build_flags = 
; (Windows) build_cache_dir = C:/path/to/cache/folder build_type = debug


[env:MusicPlayer]
platform = https://ghfast.top/https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board =  esp32-s3-LiClock-n32r2 
lib_archive = yes
monitor_speed = 115200
upload_speed = 2000000
debug_tool = esp-builtin
build_flags =
    -Wl,--wrap=xTaskCreatePinnedToCore
    -Wl,--wrap=rtc_sleep_start
    ; -D ENABLE_FLAC_DECODE_TIMING=1
    ; -D USE_FILL_TASK=1
    -D CONFIG_SPI_MOSI=35
    -D CONFIG_SPI_SCK=36
    -D CONFIG_SPI_CS=37
    -D CONFIG_PIN_DC=38
    -D CONFIG_PIN_RST=39
    -D CONFIG_PIN_TE=40
    -D CONFIG_SPI_MISO=-1
	-D CORE_DEBUG_LEVEL=4
	-D CONFIG_ARDUHAL_LOG_COLORS=1 
	-D CONFIG_DAC_32bit=1 
    -D BOARD_HAS_PSRAM
custom_component_remove = 
                        espressif/esp_hosted
                        espressif/esp_wifi_remote
                        espressif/network_provisioning
                        espressif/esp_modem
                        espressif/esp32-camera
                        espressif/libsodium
                        espressif/esp-modbus
                        espressif/qrcode
                        espressif/esp_insights
                        espressif/esp_diag_data_store
                        espressif/esp_diagnostics
                        espressif/cbor
                        espressif/esp_rainmaker
                        espressif/rmaker_common
                        chmorgan/esp-libhelix-mp3
board_build.arduino.memory_type = qio_qspi
board_build.partitions = mypartitions.csv
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 80000000L
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
extra_scripts = ./extra_script.py