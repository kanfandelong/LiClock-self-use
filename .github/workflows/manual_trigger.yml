name: Manual Trigger Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v1.0.0'
      upload:
        description: 'Upload firmware to release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # 获取所有历史和标签

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Check if tag exists
      id: check_tag
      run: |
        if git rev-parse "refs/tags/${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
          echo "tag_exists=true" >> $GITHUB_OUTPUT
        else
          echo "tag_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Generate unique tag if needed
      id: set_tag
      run: |
        if [ "${{ steps.check_tag.outputs.tag_exists }}" = "true" ]; then
          echo "Tag already exists, generating unique tag"
          new_tag="${{ github.event.inputs.tag }}-$(date +'%Y%m%d%H%M%S')"
          echo "release_tag=$new_tag" >> $GITHUB_OUTPUT
          echo "is_unique=true" >> $GITHUB_OUTPUT
        else
          echo "Tag does not exist, using original tag"
          echo "release_tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          echo "is_unique=false" >> $GITHUB_OUTPUT
        fi

    - name: Build project
      id: build
      run: |
        platformio run
        if [ -f ".pio/build/esp32solo1/firmware.bin" ]; then
          echo "build_success=true" >> $GITHUB_OUTPUT
        else
          echo "build_success=false" >> $GITHUB_OUTPUT
          echo "Firmware file not found!"
          exit 1
        fi

    - name: Create GitHub Release
      id: create_release
      if: ${{ github.event.inputs.upload == 'true' && steps.build.outputs.build_success == 'true' }}
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.set_tag.outputs.release_tag }}
        name: Release ${{ steps.set_tag.outputs.release_tag }}
        draft: false
        prerelease: false
        generate_release_notes: true
        fail_on_unmatched_files: false

    - name: Upload firmware.bin to Release
      if: ${{ github.event.inputs.upload == 'true' && steps.build.outputs.build_success == 'true' }}
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.set_tag.outputs.release_tag }}
        files: |
          .pio/build/esp32solo1/firmware.bin
          .pio/build/esp32solo1/firmware.elf
        fail_on_unmatched_files: true

    - name: Show success message
      if: ${{ github.event.inputs.upload == 'true' && steps.build.outputs.build_success == 'true' }}
      run: |
        echo "✅ Release created: ${{ steps.set_tag.outputs.release_tag }}"
        echo "📦 Firmware files uploaded to GitHub Releases"

    - name: Show build-only message
      if: ${{ github.event.inputs.upload != 'true' && steps.build.outputs.build_success == 'true' }}
      run: |
        echo "✅ Build completed successfully"
        echo "📁 Firmware location: .pio/build/esp32solo1/"