name: PlatformIO Build and Release

on:
  workflow_dispatch:  # 仅手动触发
    inputs:
      branch:
        description: '要构建的分支（留空使用默认分支）'
        required: false
        default: ''
      envs:
        description: '要构建的环境（用逗号分隔，如 esp32solo1,esp32solo2）'
        required: true
        default: 'esp32solo1'
        type: string
      release_type:
        description: '发布类型'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - release-candidate
          - stable
      version_override:
        description: '版本号覆盖（如 1.0.0-beta.1）'
        required: false
        default: ''
      create_tag:
        description: '是否创建Tag'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.setup_vars.outputs.tag_name }}
      is_prerelease: ${{ steps.setup_vars.outputs.is_prerelease }}
      release_name: ${{ steps.setup_vars.outputs.release_name }}
      version: ${{ steps.setup_vars.outputs.version }}
      branch_name: ${{ steps.setup_vars.outputs.branch_name }}
      envs_array: ${{ steps.setup_vars.outputs.envs_array }}
      should_create_tag: ${{ steps.setup_vars.outputs.should_create_tag }}
    
    steps:
    - name: "确定触发类型和参数"
      id: setup_vars
      run: |
        echo "手动触发"
        
        # 获取分支名
        if [ -n "${{ github.event.inputs.branch }}" ]; then
          BRANCH_NAME="${{ github.event.inputs.branch }}"
        else
          # 获取仓库的默认分支
          BRANCH_NAME="${{ github.event.repository.default_branch }}"
        fi
        
        # 解析环境列表
        ENVS_INPUT="${{ github.event.inputs.envs }}"
        # 将逗号分隔的字符串转换为JSON数组格式
        ENVS_ARRAY=$(echo "$ENVS_INPUT" | jq -R -s -c 'split(",") | map(select(. != ""))')
        echo "envs_array=$ENVS_ARRAY" >> $GITHUB_OUTPUT
        
        # 确定版本号
        if [ -n "${{ github.event.inputs.version_override }}" ]; then
          VERSION="${{ github.event.inputs.version_override }}"
        else
          # 使用时间戳生成beta版本号
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          VERSION="beta-$TIMESTAMP"
        fi
        
        # 设置tag
        TAG_NAME="$VERSION"
        IS_PRERELEASE="true"
        RELEASE_NAME="Beta Release $VERSION"
        RELEASE_TYPE="${{ github.event.inputs.release_type }}"
        
        # 根据发布类型调整
        if [ "$RELEASE_TYPE" = "release-candidate" ]; then
          TAG_NAME="rc-$TIMESTAMP"
          RELEASE_NAME="Release Candidate $TIMESTAMP"
        elif [ "$RELEASE_TYPE" = "stable" ]; then
          RELEASE_NAME="Stable Release $VERSION"
          IS_PRERELEASE="false"
        fi
        
        # 是否创建tag
        SHOULD_CREATE_TAG="${{ github.event.inputs.create_tag }}"
        
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
        echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
        echo "should_create_tag=$SHOULD_CREATE_TAG" >> $GITHUB_OUTPUT
        
        echo "设置完成:"
        echo "分支: $BRANCH_NAME"
        echo "Tag: $TAG_NAME"
        echo "版本: $VERSION"
        echo "预发布: $IS_PRERELEASE"
        echo "发布名称: $RELEASE_NAME"
        echo "构建环境: $ENVS_INPUT"
        echo "创建Tag: $SHOULD_CREATE_TAG"

  build:
    needs: setup
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # 动态环境列表，从setup任务中获取
        env: ${{ fromJson(needs.setup.outputs.envs_array) }}
    
    steps:
    - name: "检出代码"
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.setup.outputs.branch_name }}

    - name: "设置缓存"
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio
          .pio/build
          .pio/libdeps
        key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'lib/**/*.h', 'lib/**/*.cpp') }}-${{ matrix.env }}

    - name: "处理linux和Windows的路径"
      run: |
        if [ -f "src/hal.cpp" ]; then
          sed 's|#include <esp32\\rom\\sha.h>|#include <esp32/rom/sha.h>|' src/hal.cpp -i
        else
          echo "警告: src/hal.cpp 文件不存在，跳过路径处理"
        fi
    
    - name: "准备python"
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: "安装 platformio"
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: "使用platformio构建"
      run: |
        echo "Building for environment: ${{ matrix.env }}"
        echo "版本: ${{ needs.setup.outputs.version }}"
        echo "分支: ${{ needs.setup.outputs.branch_name }}"
        pio run -e ${{ matrix.env }}
    
    - name: "收集固件"
      run: |
        mkdir -p artifacts/${{ matrix.env }}/flash_16mb
        mkdir -p artifacts/${{ matrix.env }}/flash_8mb
        mkdir -p artifacts/${{ matrix.env }}/flash_4mb
        
        # 复制16MB版本文件
        if [ -f ".pio/build/${{ matrix.env }}/firmware.bin" ]; then
          cp .pio/build/${{ matrix.env }}/firmware.bin artifacts/${{ matrix.env }}/flash_16mb/
        fi
        if [ -f ".pio/build/${{ matrix.env }}/firmware.elf" ]; then
          cp .pio/build/${{ matrix.env }}/firmware.elf artifacts/${{ matrix.env }}/flash_16mb/
        fi
        if [ -f ".pio/build/${{ matrix.env }}/partitions.bin" ]; then
          cp .pio/build/${{ matrix.env }}/partitions.bin artifacts/${{ matrix.env }}/flash_16mb/
        fi
        if [ -f ".pio/build/${{ matrix.env }}/bootloader.bin" ]; then
          cp .pio/build/${{ matrix.env }}/bootloader.bin artifacts/${{ matrix.env }}/flash_16mb/
        fi
        
        # 复制8MB版本文件
        if [ -f ".pio/build/${{ matrix.env }}/firmware.bin" ]; then
          cp .pio/build/${{ matrix.env }}/firmware.bin artifacts/${{ matrix.env }}/flash_8mb/
        fi
        if [ -f ".pio/build/${{ matrix.env }}/firmware.elf" ]; then
          cp .pio/build/${{ matrix.env }}/firmware.elf artifacts/${{ matrix.env }}/flash_8mb/
        fi
        if [ -f "dist/partitions-8MB.bin" ]; then
          cp dist/partitions-8MB.bin artifacts/${{ matrix.env }}/flash_8mb/partitions.bin
        fi
        if [ -f "dist/bootloader-8MB.bin" ]; then
          cp dist/bootloader-8MB.bin artifacts/${{ matrix.env }}/flash_8mb/bootloader.bin
        fi
        
        # 复制4MB版本文件
        if [ -f ".pio/build/${{ matrix.env }}/firmware.bin" ]; then
          cp .pio/build/${{ matrix.env }}/firmware.bin artifacts/${{ matrix.env }}/flash_4mb/
        fi
        if [ -f ".pio/build/${{ matrix.env }}/firmware.elf" ]; then
          cp .pio/build/${{ matrix.env }}/firmware.elf artifacts/${{ matrix.env }}/flash_4mb/
        fi
        if [ -f "dist/partitions-4MB.bin" ]; then
          cp dist/partitions-4MB.bin artifacts/${{ matrix.env }}/flash_4mb/partitions.bin
        fi
        if [ -f "dist/bootloader-4MB.bin" ]; then
          cp dist/bootloader-4MB.bin artifacts/${{ matrix.env }}/flash_4mb/bootloader.bin
        fi
        
        for size in 4mb 8mb 16mb; do
          {
            echo "固件包说明"
            echo "=========="
            echo ""
            echo "环境: ${{ matrix.env }}"
            echo "Flash 大小: ${size^^}"
            echo "固件版本: ${{ needs.setup.outputs.version }}"
            echo "分支: ${{ needs.setup.outputs.branch_name }}"
            echo "构建时间: $(date)"
            echo "Git Commit: ${{ github.sha }}"
            echo "触发方式: ${{ github.event_name }}"
            echo "触发者: ${{ github.actor }}"
            echo ""
            echo "包含文件:"
            echo "- firmware.bin: 主固件文件"
            echo "- firmware.elf: 调试文件"
            echo "- partitions.bin: 分区表文件"
            echo "- bootloader.bin: 引导程序文件"
            echo ""
            echo "刷写顺序:"
            echo "1. bootloader.bin @ 0x1000"
            echo "2. partitions.bin @ 0x8000"
            echo "3. firmware.bin @ 0x10000"
            echo ""
            echo "注意: 请根据您的设备Flash大小选择合适的包"
          } > artifacts/${{ matrix.env }}/flash_${size}/README.txt
        done
    
    - name: "创建固件压缩包"
      run: |
        mkdir -p packages/${{ matrix.env }}
        
        for size in 4mb 8mb 16mb; do
          echo "为环境 ${{ matrix.env }} 创建 Flash ${size^^} 的压缩包..."
          
          # 进入目录创建tar.gz
          cd artifacts/${{ matrix.env }}/flash_${size}
          tar -czf ../../../packages/${{ matrix.env }}/firmware_${size^^}.tar.gz *
          cd ../../..
          
          # 创建zip包
          cd artifacts/${{ matrix.env }}/flash_${size}
          zip -r ../../../packages/${{ matrix.env }}/firmware_${size^^}.zip *
          cd ../../..
        done
        
        echo "为环境 ${{ matrix.env }} 创建通用压缩包..."
        cd artifacts/${{ matrix.env }}
        tar -czf ../../packages/${{ matrix.env }}/all_flash_sizes.tar.gz *
        zip -r ../../packages/${{ matrix.env }}/all_flash_sizes.zip *
        cd ../..
        
        echo "环境 ${{ matrix.env }} 生成的压缩包："
        ls -lh packages/${{ matrix.env }}/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-artifacts-${{ matrix.env }}
        path: |
          artifacts/${{ matrix.env }}/
          packages/${{ matrix.env }}/
        if-no-files-found: error
  
  create-release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.setup.outputs.branch_name }}
    
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: all_artifacts
    
    - name: "创建Tag（当需要时）"
      if: needs.setup.outputs.should_create_tag == 'true'
      run: |
        TAG_NAME="${{ needs.setup.outputs.tag_name }}"
        # 检查tag是否已存在
        echo "检查tag $TAG_NAME 是否存在..."
        
        if ! git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
          echo "创建新tag: $TAG_NAME"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "$TAG_NAME" -m "Release created by GitHub Actions - ${{ needs.setup.outputs.release_name }}"
          git push origin "$TAG_NAME"
        else
          echo "Tag $TAG_NAME 已存在，跳过创建"
        fi
    
    - name: Prepare release files
      run: |
        echo "当前目录结构:"
        find all_artifacts -type f | head -20
        echo ""
        
        mkdir -p release_files
        
        # 复制所有环境的压缩包
        for env_dir in all_artifacts/firmware-artifacts-*; do
          if [ -d "$env_dir" ]; then
            env_name=$(basename "$env_dir" | sed 's/firmware-artifacts-//')
            mkdir -p release_files/$env_name
            
            # 复制压缩包
            if [ -d "$env_dir/packages/$env_name" ]; then
              echo "复制环境 $env_name 的压缩包文件..."
              cp "$env_dir/packages/$env_name"/*.tar.gz release_files/$env_name/ 2>/dev/null || true
              cp "$env_dir/packages/$env_name"/*.zip release_files/$env_name/ 2>/dev/null || true
            fi
            
            # 复制原始文件目录
            mkdir -p release_files/$env_name/original_files
            if [ -d "$env_dir/artifacts/$env_name" ]; then
              echo "复制环境 $env_name 的原始文件..."
              cp -r "$env_dir/artifacts/$env_name"/* release_files/$env_name/original_files/ 2>/dev/null || true
            fi
          fi
        done
        
        echo "release_files目录内容:"
        find release_files -type f | head -20
        
        # 创建文件列表说明
        echo "# 文件列表" > release_files/FILE_LIST.md
        echo "" >> release_files/FILE_LIST.md
        echo "## 构建信息" >> release_files/FILE_LIST.md
        echo "" >> release_files/FILE_LIST.md
        echo "- **版本:** ${{ needs.setup.outputs.version }}" >> release_files/FILE_LIST.md
        echo "- **分支:** ${{ needs.setup.outputs.branch_name }}" >> release_files/FILE_LIST.md
        echo "- **触发方式:** ${{ github.event_name }}" >> release_files/FILE_LIST.md
        echo "- **触发者:** ${{ github.actor }}" >> release_files/FILE_LIST.md
        echo "- **Commit:** ${{ github.sha }}" >> release_files/FILE_LIST.md
        echo "- **构建环境:** ${{ github.event.inputs.envs }}" >> release_files/FILE_LIST.md
        echo "" >> release_files/FILE_LIST.md
        
        # 统计每个环境的文件
        for env_dir in release_files/*/; do
          if [ -d "$env_dir" ]; then
            env_name=$(basename "$env_dir")
            echo "## 环境: $env_name" >> release_files/FILE_LIST.md
            echo "" >> release_files/FILE_LIST.md
            
            # 压缩包
            echo "### 压缩包" >> release_files/FILE_LIST.md
            echo "" >> release_files/FILE_LIST.md
            for file in "$env_dir"/*.tar.gz "$env_dir"/*.zip; do
              if [ -f "$file" ]; then
                size=$(du -h "$file" | cut -f1)
                echo "- $(basename "$file") ($size)" >> release_files/FILE_LIST.md
              fi
            done
            
            # 原始文件
            echo "" >> release_files/FILE_LIST.md
            echo "### 原始文件目录" >> release_files/FILE_LIST.md
            echo "" >> release_files/FILE_LIST.md
            if [ -d "$env_dir/original_files" ]; then
              for subdir in "$env_dir/original_files"/*/; do
                if [ -d "$subdir" ]; then
                  dir_name=$(basename "$subdir")
                  echo "- $dir_name/: ${dir_name^^} Flash 版本" >> release_files/FILE_LIST.md
                fi
              done
            fi
            echo "" >> release_files/FILE_LIST.md
          fi
        done
    
    - name: "创建发行版"
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ needs.setup.outputs.release_name }}
        tag_name: ${{ needs.setup.outputs.tag_name }}
        body: |
          ## ESP32 固件发行版
          
          **版本:** ${{ needs.setup.outputs.version }}
          **分支:** ${{ needs.setup.outputs.branch_name }}
          **构建时间:** ${{ github.event.repository.updated_at }}
          **触发方式:** ${{ github.event_name }}
          **触发者:** ${{ github.actor }}
          **构建环境:** ${{ github.event.inputs.envs }}
          
          ### 支持的Flash大小
          1. **4MB Flash**: 适用于4MB Flash的ESP32设备
          2. **8MB Flash**: 适用于8MB Flash的ESP32设备  
          3. **16MB Flash**: 适用于16MB Flash的ESP32设备
          
          ### 文件说明
          每个环境目录下包含：
          - **firmware_4MB.tar.gz/zip**: 4MB Flash完整包
          - **firmware_8MB.tar.gz/zip**: 8MB Flash完整包
          - **firmware_16MB.tar.gz/zip**: 16MB Flash完整包
          - **all_flash_sizes.tar.gz/zip**: 包含所有版本
          
          每个压缩包包含：
          - `firmware.bin`: 主固件（所有版本共用）
          - `firmware.elf`: 调试文件
          - `partitions.bin`: 对应Flash大小的分区表
          - `bootloader.bin`: 对应Flash大小的引导程序
          - `README.txt`: 使用说明
          
          ### 刷写说明
          使用 esptool.py 刷写：
          ```bash
          esptool.py --port /dev/ttyUSB0 write_flash \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 firmware.bin
          ```
          
          ### 构建信息
          - **Commit:** ${{ github.sha }}
          - **触发者:** ${{ github.actor }}
          - **环境:** ${{ github.event.inputs.envs }}
          
          **注意:** 这是${{ needs.setup.outputs.is_prerelease == 'true' && '预发布版' || '稳定版' }}，请谨慎用于生产环境。
        
        draft: false
        prerelease: ${{ needs.setup.outputs.is_prerelease == 'true' }}
        files: |
          release_files/**/*.tar.gz
          release_files/**/*.zip