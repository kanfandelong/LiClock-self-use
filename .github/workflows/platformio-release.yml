name: Build and Release ESP32 Firmware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'latest'
      release_name:
        description: 'Release name'
        required: true
        default: 'ESP32 Firmware Release'
      build_env:
        description: 'PlatformIO environment (from platformio.ini)'
        required: true
        default: 'MusicPlayer'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许创建 Release 并上传文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e ${{ github.event.inputs.build_env }}

      - name: Prepare firmware files
        id: prepare
        run: |
          # 查找编译生成的固件文件（常见为 firmware.bin 或类似）
          FIRMWARE_PATH=".pio/build/${{ github.event.inputs.build_env }}/firmware.bin"
          if [ ! -f "$FIRMWARE_PATH" ]; then
            echo "❌ Firmware not found at $FIRMWARE_PATH"
            exit 1
          fi
          # 复制一份并重命名（可选）
          cp "$FIRMWARE_PATH" "firmware_${{ github.event.inputs.build_env }}.bin"
          echo "firmware_name=firmware_${{ github.event.inputs.build_env }}.bin" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name }}
          body: |
            Auto-generated release for PlatformIO ESP32 project.
            Environment: ${{ github.event.inputs.build_env }}
          draft: false
          prerelease: false
          files: ${{ steps.prepare.outputs.firmware_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
