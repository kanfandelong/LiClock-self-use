name: PlatformIO Build and Release

on:
  push:
    tags:
      - 'v*'  # 匹配 v1.0.0, v1.2.3 等标签
      - 'release-*'  # 或者自定义的release标签
  workflow_dispatch:  # 手动触发
    inputs:
      branch:
        description: '要构建的分支（留空使用默认分支）'
        required: false
        default: ''
      release_type:
        description: '发布类型'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - release-candidate
          - stable
      version_override:
        description: '版本号覆盖（如 1.0.0-beta.1）'
        required: false
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.setup_vars.outputs.tag_name }}
      is_prerelease: ${{ steps.setup_vars.outputs.is_prerelease }}
      release_name: ${{ steps.setup_vars.outputs.release_name }}
      version: ${{ steps.setup_vars.outputs.version }}
      branch_name: ${{ steps.setup_vars.outputs.branch_name }}
    
    steps:
    - name: "确定触发类型和参数"
      id: setup_vars
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "手动触发"
          
          # 获取分支名
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            BRANCH_NAME="${{ github.event.inputs.branch }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          
          # 确定版本号
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VERSION="${{ github.event.inputs.version_override }}"
          else
            # 使用时间戳生成beta版本号
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            VERSION="beta-$TIMESTAMP"
          fi
          
          # 设置tag
          TAG_NAME="$VERSION"
          IS_PRERELEASE="true"
          RELEASE_NAME="Beta Release $VERSION"
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          
          # 根据发布类型调整
          if [ "$RELEASE_TYPE" = "release-candidate" ]; then
            TAG_NAME="rc-$TIMESTAMP"
            RELEASE_NAME="Release Candidate $TIMESTAMP"
          elif [ "$RELEASE_TYPE" = "stable" ]; then
            RELEASE_NAME="Stable Release $VERSION"
            IS_PRERELEASE="false"
          fi
          
        else
          echo "Tag触发"
          BRANCH_NAME="${{ github.ref_name }}"
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${{ github.ref_name }}"
          RELEASE_NAME="Release ${{ github.ref_name }}"
          
          # 判断是否为预发布版（beta, rc, alpha等）
          if [[ "${{ github.ref_name }}" =~ -(beta|rc|alpha|dev) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
        fi
        
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
        echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
        
        echo "设置完成:"
        echo "分支: $BRANCH_NAME"
        echo "Tag: $TAG_NAME"
        echo "版本: $VERSION"
        echo "预发布: $IS_PRERELEASE"
        echo "发布名称: $RELEASE_NAME"

  build:
    needs: setup
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # 配置你要构建的环境，对应 platformio.ini 中的 envs
        env: [esp32solo1]
    
    steps:
    - name: "检出代码"
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.setup.outputs.branch_name }}

    - name: "设置缓存"
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio
          .pio/build
          .pio/libdeps
        key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'lib/**/*.h', 'lib/**/*.cpp') }}

    - name: "处理linux和Windows的路径"
      run: |
        sed 's|#include <esp32\\rom\\sha.h>|#include <esp32/rom/sha.h>|' src/hal.cpp -i
    
    - name: "准备python"
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: "安装 platformio"
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: "使用platformio构建"
      run: |
        echo "Building for environment: ${{ matrix.env }}"
        echo "版本: ${{ needs.setup.outputs.version }}"
        echo "分支: ${{ needs.setup.outputs.branch_name }}"
        pio run -e ${{ matrix.env }}
    
    - name: "收集固件"
      run: |
        mkdir -p artifacts/flash_16mb
        mkdir -p artifacts/flash_8mb
        mkdir -p artifacts/flash_4mb
        
        cp .pio/build/${{ matrix.env }}/firmware.bin artifacts/flash_16mb/
        cp .pio/build/${{ matrix.env }}/firmware.elf artifacts/flash_16mb/
        cp .pio/build/${{ matrix.env }}/partitions.bin artifacts/flash_16mb/
        cp .pio/build/${{ matrix.env }}/bootloader.bin artifacts/flash_16mb/
        
        cp .pio/build/${{ matrix.env }}/firmware.bin artifacts/flash_8mb/
        cp .pio/build/${{ matrix.env }}/firmware.elf artifacts/flash_8mb/
        cp dist/partitions-8MB.bin artifacts/flash_8mb/partitions.bin
        cp dist/bootloader-8MB.bin artifacts/flash_8mb/bootloader.bin
        
        cp .pio/build/${{ matrix.env }}/firmware.bin artifacts/flash_4mb/
        cp .pio/build/${{ matrix.env }}/firmware.elf artifacts/flash_4mb/
        cp dist/partitions-4MB.bin artifacts/flash_4mb/partitions.bin
        cp dist/bootloader-4MB.bin artifacts/flash_4mb/bootloader.bin
        
        for size in 4mb 8mb 16mb; do
          {
            echo "固件包说明"
            echo "=========="
            echo ""
            echo "Flash 大小: ${size^^}"
            echo "固件版本: ${{ needs.setup.outputs.version }}"
            echo "分支: ${{ needs.setup.outputs.branch_name }}"
            echo "构建时间: $(date)"
            echo "Git Commit: ${{ github.sha }}"
            echo "触发方式: ${{ github.event_name }}"
            echo "触发者: ${{ github.actor }}"
            echo ""
            echo "包含文件:"
            echo "- firmware.bin: 主固件文件"
            echo "- firmware.elf: 调试文件"
            echo "- partitions.bin: 分区表文件"
            echo "- bootloader.bin: 引导程序文件"
            echo ""
            echo "刷写顺序:"
            echo "1. bootloader.bin @ 0x1000"
            echo "2. partitions.bin @ 0x8000"
            echo "3. firmware.bin @ 0x10000"
            echo ""
            echo "注意: 请根据您的设备Flash大小选择合适的包"
          } > artifacts/flash_${size}/README.txt
        done
    
    - name: "创建固件压缩包"
      run: |
        mkdir -p packages
        
        for size in 4mb 8mb 16mb; do
          echo "创建 Flash ${size^^} 的压缩包..."
          
          # 进入目录创建tar.gz
          cd artifacts/flash_${size}
          tar -czf ../../packages/firmware_${size^^}.tar.gz *
          cd ../..
          
          # 创建zip包
          cd artifacts/flash_${size}
          zip -r ../../packages/firmware_${size^^}.zip *
          cd ../..
        done
        
        echo "创建通用压缩包..."
        cd artifacts
        tar -czf ../packages/all_flash_sizes.tar.gz *
        zip -r ../packages/all_flash_sizes.zip *
        cd ..
        
        echo "生成的压缩包："
        ls -lh packages/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-artifacts
        path: |
          artifacts/
          packages/
        if-no-files-found: error
  
  create-release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        name: firmware-artifacts
        path: all_artifacts
    
    - name: Prepare release files
      run: |
        echo "当前目录结构:"
        find all_artifacts -type f | head -20
        echo ""
        
        mkdir -p release_files
        
        # 复制压缩包
        if [ -d "all_artifacts/packages" ]; then
          echo "复制压缩包文件..."
          cp all_artifacts/packages/*.tar.gz release_files/ 2>/dev/null || true
          cp all_artifacts/packages/*.zip release_files/ 2>/dev/null || true
        else
          echo "警告: packages目录不存在"
          find all_artifacts -name "*.tar.gz" -o -name "*.zip" | while read file; do
            echo "找到文件: $file"
            cp "$file" release_files/ 2>/dev/null || true
          done
        fi
        
        # 复制原始文件目录
        mkdir -p release_files/original_files
        if [ -d "all_artifacts/artifacts" ]; then
          echo "复制原始文件..."
          cp -r all_artifacts/artifacts/* release_files/original_files/ 2>/dev/null || true
        fi
        
        echo "release_files目录内容:"
        ls -la release_files/
        echo ""
        echo "release_files/*.tar.gz 匹配结果:"
        ls -la release_files/*.tar.gz 2>/dev/null || echo "没有找到.tar.gz文件"
        echo ""
        echo "release_files/*.zip 匹配结果:"
        ls -la release_files/*.zip 2>/dev/null || echo "没有找到.zip文件"
        
        echo "# 文件列表" > release_files/FILE_LIST.md
        echo "" >> release_files/FILE_LIST.md
        echo "## 构建信息" >> release_files/FILE_LIST.md
        echo "" >> release_files/FILE_LIST.md
        echo "- **版本:** ${{ needs.setup.outputs.version }}" >> release_files/FILE_LIST.md
        echo "- **分支:** ${{ needs.setup.outputs.branch_name }}" >> release_files/FILE_LIST.md
        echo "- **触发方式:** ${{ github.event_name }}" >> release_files/FILE_LIST.md
        echo "- **触发者:** ${{ github.actor }}" >> release_files/FILE_LIST.md
        echo "- **Commit:** ${{ github.sha }}" >> release_files/FILE_LIST.md
        echo "" >> release_files/FILE_LIST.md
        echo "## 压缩包" >> release_files/FILE_LIST.md
        echo "" >> release_files/FILE_LIST.md
        
        # 统计文件大小并记录
        for file in release_files/*.tar.gz release_files/*.zip; do
          if [ -f "$file" ]; then
            size=$(du -h "$file" | cut -f1)
            echo "- $(basename "$file") ($size)" >> release_files/FILE_LIST.md
          fi
        done
        
        echo "" >> release_files/FILE_LIST.md
        echo "## 原始文件目录" >> release_files/FILE_LIST.md
        echo "" >> release_files/FILE_LIST.md
        echo "- flash_4mb/: 4MB Flash 版本" >> release_files/FILE_LIST.md
        echo "- flash_8mb/: 8MB Flash 版本" >> release_files/FILE_LIST.md
        echo "- flash_16mb/: 16MB Flash 版本" >> release_files/FILE_LIST.md
    
    - name: "创建Tag（仅手动触发且tag不存在时）"
      if: github.event_name == 'workflow_dispatch'
      run: |
        TAG_NAME="${{ needs.setup.outputs.tag_name }}"
        # 检查tag是否已存在
        echo "检查tag $TAG_NAME 是否存在..."
        
        if ! git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
          echo "创建新tag: $TAG_NAME"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "$TAG_NAME" -m "Beta release created by GitHub Actions"
          git push origin "$TAG_NAME"
        else
          echo "Tag $TAG_NAME 已存在，跳过创建"
        fi
    
    - name: "创建发行版"
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ needs.setup.outputs.release_name }}
        tag_name: ${{ needs.setup.outputs.tag_name }}
        body: |
          ## ESP32 固件发行版
          
          **版本:** ${{ needs.setup.outputs.version }}
          **分支:** ${{ needs.setup.outputs.branch_name }}
          **构建时间:** ${{ github.event.repository.updated_at }}
          **触发方式:** ${{ github.event_name }}
          **触发者:** ${{ github.actor }}
          
          ### 支持三种Flash大小
          1. **4MB Flash**: 适用于4MB Flash的ESP32设备
          2. **8MB Flash**: 适用于8MB Flash的ESP32设备  
          3. **16MB Flash**: 适用于16MB Flash的ESP32设备
          
          ### 文件说明
          - **firmware_4MB.tar.gz/zip**: 4MB Flash完整包
          - **firmware_8MB.tar.gz/zip**: 8MB Flash完整包
          - **firmware_16MB.tar.gz/zip**: 16MB Flash完整包
          - **all_flash_sizes.tar.gz/zip**: 包含所有版本
          
          每个压缩包包含：
          - `firmware.bin`: 主固件（所有版本共用）
          - `firmware.elf`: 调试文件
          - `partitions.bin`: 对应Flash大小的分区表
          - `bootloader.bin`: 对应Flash大小的引导程序
          - `README.txt`: 使用说明
          
          ### 刷写说明
          使用 esptool.py 刷写：
          ```bash
          esptool.py --port /dev/ttyUSB0 write_flash \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 firmware.bin
          ```
          
          ### 构建信息
          - **Commit:** ${{ github.sha }}
          - **触发者:** ${{ github.actor }}
          - **board:** esp32dev
          
          **注意:** 这是${{ needs.setup.outputs.is_prerelease == 'true' && '预发布版' || '稳定版' }}，请谨慎用于生产环境。
        
        draft: false
        prerelease: ${{ needs.setup.outputs.is_prerelease == 'true' }}
        files: |
          release_files/*.tar.gz
          release_files/*.zip
